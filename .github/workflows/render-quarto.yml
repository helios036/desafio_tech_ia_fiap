name: Render Quarto

on:
  push:
    paths:
      - "mapa_agentes_ia.qmd"
      - "styles/**"
      - ".github/workflows/render-quarto.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Renderizar relatório
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html
          path: mapa_agentes_ia.qmd

      - name: Atualizar HTML no repositório
        uses: EndBug/add-and-commit@v9
        with:
          message: "Atualiza relatório HTML"
          add: "mapa_agentes_ia.html"
